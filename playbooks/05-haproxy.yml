- name: Configure Kubernetes API HAProxy
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - ../group_vars/k8s.yml

  tasks:
  
    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: true

    - name: Deploy HAProxy configuration
      ansible.builtin.template:
        src: ../templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
        backup: true
      notify: Restart HAProxy

    - name: Enable HAProxy
      ansible.builtin.systemd:
        name: haproxy
        enabled: true

  handlers:

    - name: Restart HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted