- name: Install Kubernetes packages
  hosts: k8s
  become: true

  vars_files:
    - ../group_vars/k8s.yml

  tasks:

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes signing key
      ansible.builtin.shell:
        cmd: >
          curl -fsSL
          https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/Release.key
          | gpg --dearmor
          -o {{ kubernetes_apt_keyring }}
      args:
        creates: "{{ kubernetes_apt_keyring }}"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ kubernetes_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install kubelet
      ansible.builtin.apt:
        name: kubelet
        state: present

    - name: Install kubeadm
      ansible.builtin.apt:
        name: kubeadm
        state: present

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    - name: Hold kubelet
      ansible.builtin.dpkg_selections:
        name: kubelet
        selection: hold

    - name: Hold kubeadm
      ansible.builtin.dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Hold kubectl
      ansible.builtin.dpkg_selections:
        name: kubectl
        selection: hold

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true