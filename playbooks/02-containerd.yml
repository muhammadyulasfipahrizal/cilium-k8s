- name: Install and configure containerd
  hosts: k8s
  become: true

  vars_files:
    - ../group_vars/k8s.yml

  tasks:

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate containerd configuration
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configure containerd systemd cgroup
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Ensure CRI plugin is enabled
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins\s*=\s*\["cri"\]'
        replace: '# disabled_plugins = ["cri"]'

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Verify containerd
      ansible.builtin.command:
        cmd: ctr version
      register: containerd_version
      changed_when: false

    - name: Show containerd version
      ansible.builtin.debug:
        var: containerd_version.stdout